name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsgo --noEmit
      - name: SEO checks (sitemap, robots, JSON-LD, canonical, headings)
        run: bunx vitest run src/lib/sitemap-entries.test.ts src/lib/seo-structured-data.test.ts --reporter=verbose
      - name: Unit tests
        run: bunx vitest run --reporter=verbose
      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy
          VITE_SUPABASE_PROJECT_ID: example
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy
          VITE_SUPABASE_PROJECT_ID: example
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy
      - name: Start preview server
        run: |
          bun run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in {1..30}; do
            if curl -fsS http://localhost:8080 > /dev/null 2>&1; then
              echo "server up"; break
            fi
            sleep 1
          done
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy
          VITE_SUPABASE_PROJECT_ID: example
      - name: Run E2E smoke tests
        run: bunx playwright test --reporter=line
      - name: Stop preview server
        if: always()
        run: kill $(cat /tmp/dev.pid) || true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
