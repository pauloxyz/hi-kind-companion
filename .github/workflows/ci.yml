name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsgo --noEmit
      - name: Validate security config (src/config/security-internal-ids.ts)
        # Fails the build if the single source of truth is malformed,
        # empty, or drifted (duplicates, allow/deny overlap, missing hook
        # files). This runs before the regression suite so we fail fast on
        # config drift instead of on downstream test noise.
        run: bun run security:validate-config
      - name: SEO checks (sitemap, robots, JSON-LD, canonical, headings)
        run: bunx vitest run src/lib/sitemap-entries.test.ts src/lib/seo-structured-data.test.ts --reporter=verbose
      - name: Unit tests
        run: bunx vitest run --reporter=verbose
      - name: Security regression tests (column GRANTs + SECURITY DEFINER EXECUTE + CRON_SECRET)
        # Dedicated gate: fails the build if any of the hardening applied on
        # 2026-07-01 has been reverted — sensitive anon column access on
        # jobs/my_profile, anon/authenticated EXECUTE on internal
        # SECURITY DEFINER functions, anon read on email queue tables, or
        # a public /api/public/hooks route that no longer enforces
        # CRON_SECRET. JSON output is emitted for the report artifact.
        run: |
          mkdir -p security-report
          bunx vitest run \
            src/lib/security-regression.integration.test.ts \
            src/lib/cron-auth.server.test.ts \
            src/routes/api/public/hooks/cron-secret-regression.test.ts \
            --reporter=verbose \
            --reporter=json --outputFile=security-report/regression-results.json
        env:
          CRON_SECRET: ci-regression-cron-secret-placeholder-do-not-use-in-prod
          VITE_SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
          SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
          SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
      - name: SECURITY DEFINER / GRANT coherence check
        # Independent probe (not vitest) — asserts every internal SECURITY
        # DEFINER function is inaccessible to anon and every public helper
        # remains callable. Fails the build the moment a migration
        # re-GRANTs EXECUTE on a locked-down function.
        run: bun run security:coherence
        env:
          VITE_SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
          SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
      - name: Download previous CI security artifact (best-effort)
        id: prev_ci
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: ci.yml
          workflow_conclusion: ""
          name_is_regexp: true
          name: security-report-.*
          path: previous-security-report/
          if_no_artifact_found: warn
      - name: Compare against previous CI artifact (fail on drift)
        # Diffs the current regression-results.json against the last CI
        # artifact and fails the build if any TARGET_INTERNAL_IDS
        # reappear or previously-passing tests regressed. Delta is
        # written to security-report/delta.{md,json} and uploaded with
        # the report artifact for review on the PR.
        run: |
          PREV=$(find previous-security-report -name regression-results.json -print -quit 2>/dev/null || true)
          echo "Previous artifact: ${PREV:-<none>}"
          bun run scripts/compare-security-artifacts.ts \
            ${PREV:+--previous "$PREV"} \
            --current security-report/regression-results.json \
            --out security-report/delta.md
      - name: Upload security report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.run_number }}
          path: security-report/
          retention-days: 30
      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
          VITE_SUPABASE_PROJECT_ID: lkvfvriexuxlvrufbqbf
          SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
          VITE_SUPABASE_PROJECT_ID: lkvfvriexuxlvrufbqbf
          SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
      - name: Start preview server
        run: |
          bun run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in {1..30}; do
            if curl -fsS http://localhost:8080 > /dev/null 2>&1; then
              echo "server up"; break
            fi
            sleep 1
          done
        env:
          VITE_SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
          VITE_SUPABASE_PROJECT_ID: lkvfvriexuxlvrufbqbf
          SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
      - name: Run E2E smoke tests
        run: bunx playwright test --reporter=line
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          E2E_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
      - name: Stop preview server
        if: always()
        run: kill $(cat /tmp/dev.pid) || true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
