name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsgo --noEmit
      - name: Validate security config (src/config/security-internal-ids.ts)
        # Fails the build if the single source of truth is malformed,
        # empty, or drifted (duplicates, allow/deny overlap, missing hook
        # files). This runs before the regression suite so we fail fast on
        # config drift instead of on downstream test noise.
        run: bun run security:validate-config
      - name: SEO checks (sitemap, robots, JSON-LD, canonical, headings)
        run: bunx vitest run src/lib/sitemap-entries.test.ts src/lib/seo-structured-data.test.ts --reporter=verbose
      - name: Unit tests
        run: bunx vitest run --reporter=verbose
      - name: Security regression tests (column GRANTs + SECURITY DEFINER EXECUTE + CRON_SECRET)
        # Dedicated gate: fails the build if any of the hardening applied on
        # 2026-07-01 has been reverted — sensitive anon column access on
        # jobs/my_profile, anon/authenticated EXECUTE on internal
        # SECURITY DEFINER functions, anon read on email queue tables, or
        # a public /api/public/hooks route that no longer enforces
        # CRON_SECRET. JSON output is emitted for the report artifact.
        run: |
          mkdir -p security-report
          bunx vitest run \
            src/lib/security-regression.integration.test.ts \
            src/lib/cron-auth.server.test.ts \
            src/routes/api/public/hooks/cron-secret-regression.test.ts \
            --reporter=verbose \
            --reporter=json --outputFile=security-report/regression-results.json
        env:
          CRON_SECRET: ci-regression-cron-secret-placeholder-do-not-use-in-prod
          VITE_SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
          SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
          SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
      - name: SECURITY DEFINER / GRANT coherence check
        # Independent probe (not vitest) — asserts every internal SECURITY
        # DEFINER function is inaccessible to anon and every public helper
        # remains callable. Fails the build the moment a migration
        # re-GRANTs EXECUTE on a locked-down function.
        run: bun run security:coherence
        env:
          VITE_SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
          SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
      - name: Download previous CI security artifact (best-effort)
        id: prev_ci
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: ci.yml
          workflow_conclusion: ""
          name_is_regexp: true
          name: security-report-.*
          path: previous-security-report/
          if_no_artifact_found: warn
      - name: Resolve previous artifact path (safe fallback)
        id: prev_path
        # Explicit fallback: when no previous artifact exists (first run
        # on a fresh branch, deleted retention, download failure) we log
        # "baseline mode" and pass no --previous flag. The comparator
        # then produces a valid delta and exits 0 without masking any
        # real failure — the current-run test failures still surface via
        # the regression step's own exit code.
        run: |
          PREV=$(find previous-security-report -name regression-results.json -print -quit 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            echo "⚠ No previous CI security artifact found — running comparator in baseline mode."
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "baseline=true" >> "$GITHUB_OUTPUT"
          else
            echo "Previous artifact: $PREV"
            echo "path=$PREV" >> "$GITHUB_OUTPUT"
            echo "baseline=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compare against previous CI artifact (fail on drift)
        # Diffs the current regression-results.json against the last CI
        # artifact and fails the build if any TARGET_INTERNAL_IDS
        # reappear or previously-passing tests regressed. In baseline
        # mode (no previous artifact) the comparator emits delta.md/json
        # anyway so downstream summary/PR-comment steps have data.
        id: compare
        run: |
          set +e
          PREV="${{ steps.prev_path.outputs.path }}"
          bun run scripts/compare-security-artifacts.ts \
            ${PREV:+--previous "$PREV"} \
            --current security-report/regression-results.json \
            --out security-report/delta.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Emit GitHub Checks annotations per reintroduced internal_id
        # Uses the ::warning:: workflow-command channel so each reappeared
        # finding shows up as a discrete annotation in the Checks tab and
        # inline on the "Files changed" view — no third-party action needed.
        if: always()
        run: |
          if [ ! -f security-report/delta.json ]; then exit 0; fi
          CONFIG_FILE=src/config/security-internal-ids.ts
          jq -r '.reappearedInternalIds[]?' security-report/delta.json | while read -r id; do
            [ -z "$id" ] && continue
            LINE=$(grep -n "\"$id\"" "$CONFIG_FILE" | head -1 | cut -d: -f1)
            LINE=${LINE:-1}
            echo "::warning file=${CONFIG_FILE},line=${LINE},title=Security regression::Targeted internal_id \`$id\` reappeared on this run — see security-report/delta.md"
          done
          jq -r '.regressed[]?' security-report/delta.json | while read -r name; do
            [ -z "$name" ] && continue
            echo "::warning title=Regressed security test::${name} was passing on the previous artifact and failed on this run"
          done
      - name: Render security summary (table)
        # Emits a structured Markdown table into the GitHub Actions job
        # summary listing reintroduced internal_ids and regressed tests
        # pulled from security-report/delta.json.
        if: always()
        run: |
          {
            echo "# 🔒 Security regression summary"
            echo ""
            echo "- Baseline mode: \`${{ steps.prev_path.outputs.baseline }}\`"
            echo "- Previous artifact: \`${{ steps.prev_path.outputs.path || 'none' }}\`"
            echo "- Compare exit: \`${{ steps.compare.outputs.exit_code }}\`"
            echo ""
            if [ -f security-report/delta.json ]; then
              REAPPEARED=$(jq -r '.reappearedInternalIds | length' security-report/delta.json)
              REGRESSED=$(jq -r '.totals.regressed' security-report/delta.json)
              STILL=$(jq -r '.totals.stillFailing' security-report/delta.json)
              NEWPASS=$(jq -r '.totals.newlyPassing' security-report/delta.json)
              echo "## Totals"
              echo ""
              echo "| Metric | Count |"
              echo "| --- | ---: |"
              echo "| Reintroduced internal_ids | ${REAPPEARED} |"
              echo "| Regressed tests | ${REGRESSED} |"
              echo "| Still failing | ${STILL} |"
              echo "| Newly passing | ${NEWPASS} |"
              echo ""
              echo "## Reintroduced internal_ids (per finding)"
              echo ""
              REAPPEARED_ROWS=$(jq -r '.reappearedInternalIds | if length == 0 then "" else map("| `" + . + "` | permission / RLS / cron_secret | see annotation |") | join("\n") end' security-report/delta.json)
              if [ -z "$REAPPEARED_ROWS" ]; then
                echo "_None — all TARGET_INTERNAL_IDS still hardened._"
              else
                echo "| internal_id | change class | source |"
                echo "| --- | --- | --- |"
                echo "$REAPPEARED_ROWS"
              fi
              echo ""
              echo "## Regressed tests"
              echo ""
              REGRESSED_ROWS=$(jq -r '.regressed | if length == 0 then "" else map("| ❌ `" + . + "` |") | join("\n") end' security-report/delta.json)
              if [ -z "$REGRESSED_ROWS" ]; then
                echo "_None — no previously-passing test failed on this run._"
              else
                echo "| test |"
                echo "| --- |"
                echo "$REGRESSED_ROWS"
              fi
            else
              echo "_delta.json not produced — comparator did not run._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload security report artifact
        # Uploaded BEFORE the PR comment step so we can embed
        # artifact-url in the comment body.
        id: upload_report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.run_number }}
          path: security-report/
          retention-days: 30
      - name: Comment security delta on PR (sticky, hash-gated)
        # Sticky comment strategy:
        #   1. Compute a content hash of the current delta.json.
        #   2. Look up any existing comment with marker <!-- lovable-security-delta -->.
        #   3. If the existing comment already contains hash:<same> → skip
        #      (no PR spam on pushes that didn't change the delta).
        #   4. Otherwise create/update with links to delta.md, delta.json
        #      and the security-report artifact just uploaded.
        # Runs only on pull_request events AND only when the comparator
        # detected drift (exit_code != 0) OR a previous comment exists
        # that needs to be updated to "resolved".
        if: github.event_name == 'pull_request' && steps.compare.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const crypto = require("crypto");
            let deltaMd = "";
            let json = null;
            try { deltaMd = fs.readFileSync("security-report/delta.md", "utf8"); } catch {}
            try { json = JSON.parse(fs.readFileSync("security-report/delta.json", "utf8")); } catch {}
            const reappeared = json?.reappearedInternalIds ?? [];
            const regressed = json?.regressed ?? [];
            const marker = "<!-- lovable-security-delta -->";
            const hashSource = JSON.stringify({ reappeared, regressed, stillFailing: json?.stillFailing ?? [] });
            const contentHash = crypto.createHash("sha256").update(hashSource).digest("hex").slice(0, 16);
            const hashTag = `<!-- delta-hash:${contentHash} -->`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing && existing.body?.includes(hashTag)) {
              core.info(`Delta content hash unchanged (${contentHash}) — leaving sticky comment as-is.`);
              return;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactUrl = `${{ steps.upload_report.outputs.artifact-url }}`;
            const artifactBrowseUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}#artifacts`;
            const body = [
              marker,
              hashTag,
              "## 🔒 Security regression detected",
              "",
              `**Reintroduced internal_ids:** ${reappeared.length}`,
              `**Regressed tests:** ${regressed.length}`,
              `**Delta hash:** \`${contentHash}\``,
              "",
              "### Reports",
              "",
              `- 📄 [Download \`delta.md\`](${artifactUrl}) — human-readable summary`,
              `- 🧾 [Download \`delta.json\`](${artifactUrl}) — machine-readable diff`,
              `- 📦 [Browse the \`security-report-${{ github.run_number }}\` artifact](${artifactBrowseUrl})`,
              `- ⚙️  [Open workflow run](${runUrl})`,
              "",
              reappeared.length
                ? "### Reintroduced internal_ids\n\n" +
                  "| internal_id |\n| --- |\n" +
                  reappeared.map((id) => `| \`${id}\` |`).join("\n")
                : "",
              regressed.length
                ? "\n### Regressed tests\n\n" +
                  "| test |\n| --- |\n" +
                  regressed.slice(0, 20).map((t) => `| ❌ \`${t}\` |`).join("\n") +
                  (regressed.length > 20 ? `\n\n_…and ${regressed.length - 20} more_` : "")
                : "",
              "",
              "<details><summary>Full delta.md excerpt</summary>\n\n" + (deltaMd || "_no delta_").slice(0, 30000) + "\n\n</details>",
            ].filter(Boolean).join("\n");

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated sticky comment with new delta hash ${contentHash}.`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info(`Created sticky comment with delta hash ${contentHash}.`);
            }
      - name: Fail step if compare detected drift
        if: steps.compare.outputs.exit_code != '0'
        run: |
          echo "❌ Security drift detected — see job summary, annotations and PR comment."
          exit 1



      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
          VITE_SUPABASE_PROJECT_ID: lkvfvriexuxlvrufbqbf
          SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
          VITE_SUPABASE_PROJECT_ID: lkvfvriexuxlvrufbqbf
          SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
      - name: Start preview server
        run: |
          bun run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in {1..30}; do
            if curl -fsS http://localhost:8080 > /dev/null 2>&1; then
              echo "server up"; break
            fi
            sleep 1
          done
        env:
          VITE_SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
          VITE_SUPABASE_PROJECT_ID: lkvfvriexuxlvrufbqbf
          SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
      - name: Run E2E smoke tests
        run: bunx playwright test --reporter=line
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          E2E_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
      - name: Stop preview server
        if: always()
        run: kill $(cat /tmp/dev.pid) || true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
