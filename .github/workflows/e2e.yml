name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast feedback: only the critical shortcuts + aria-live specs.
  smoke:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache bun's global install store, keyed on the lockfile.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      # Cache Playwright's browser download. The cache key includes the
      # @playwright/test version so a Playwright bump invalidates it.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(bun pm ls --json | jq -r '.dependencies["@playwright/test"].version // .devDependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run e2e smoke (shortcuts + aria-live)
        run: bun run e2e:smoke
        env:
          CI: "1"

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-artifacts
          path: |
            test-results/**
            playwright-report/**
          retention-days: 14
          if-no-files-found: ignore

  # Targeted regression guard: the 4 specs we have historically had to
  # stabilize (shift-tab, keyboard-only, journey-progression, shortcuts
  # feedback). Runs after smoke and BEFORE the full sharded suite so a
  # regression in any of them fails fast — without paying for 4 shards.
  targeted:
    needs: smoke
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(bun pm ls --json | jq -r '.dependencies["@playwright/test"].version // .devDependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run targeted regression specs (4 historically flaky)
        run: >-
          bunx playwright test
          --retries=2
          e2e/shift-tab-journey.spec.ts
          e2e/keyboard-only-journey.spec.ts
          e2e/journey-progression.spec.ts
          e2e/shortcuts-feedback.spec.ts
        env:
          CI: "1"

      # Same nomenclature/contract as the full shards: upload screenshots,
      # videos, traces, and error contexts on failure OR timeout. The job is
      # single-shard so the artifact name uses `shard-targeted` to keep the
      # `playwright-artifacts-shard-*` family consistent across all jobs.
      - name: Upload Playwright artifacts (shard targeted)
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-shard-targeted
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.zip
            test-results/**/error-context.md
            playwright-report/**
          retention-days: 14
          if-no-files-found: ignore

  # Full e2e suite sharded across 4 parallel runners. Each shard runs a
  # disjoint slice of the suite via Playwright's --shard=i/N flag, then
  # uploads its own artifacts on failure.
  full:
    needs: [smoke, targeted]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(bun pm ls --json | jq -r '.dependencies["@playwright/test"].version // .devDependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run full e2e shard ${{ matrix.shard }}/4
        id: full_run
        run: bunx playwright test --shard=${{ matrix.shard }}/4
        env:
          CI: "1"

      # Upload per-shard artifacts on any non-success outcome (failure OR
      # cancellation/timeout) so recurring failures in the full suite always
      # land with screenshots, videos, and traces attached to the run.
      # `screenshot`/`trace`/`video` are configured as `retain-on-failure` in
      # playwright.config.ts, so test-results/** contains the .png / .webm /
      # .zip files Playwright produced for failing tests on this shard.
      - name: Upload Playwright artifacts (shard ${{ matrix.shard }})
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.zip
            test-results/**/error-context.md
            playwright-report/**
          retention-days: 14
          if-no-files-found: ignore

      # Snapshot the first-run artifacts so the rerun step below can start
      # from a clean test-results/ and we can still ship both runs as
      # separate artifacts (no overwrite, no merge ambiguity).
      - name: Stash first-run artifacts before rerun
        if: ${{ !cancelled() && failure() }}
        run: |
          mkdir -p .rerun-input
          if [ -f test-results/.last-run.json ]; then
            cp test-results/.last-run.json .rerun-input/.last-run.json
          fi
          if [ -d test-results ]; then
            mv test-results test-results-first-run
          fi

      # Automatic rerun of ONLY the specs that failed on this shard, using
      # Playwright's `--last-failed` flag (reads test-results/.last-run.json).
      # Bumping --retries=2 gives intermittent flakes one more chance before
      # the shard is declared red. Runs only when the first attempt failed
      # and the workflow wasn't cancelled.
      - name: Rerun only failed specs (shard ${{ matrix.shard }})
        id: full_rerun
        if: ${{ !cancelled() && failure() && steps.full_run.outcome == 'failure' }}
        run: |
          mkdir -p test-results
          cp .rerun-input/.last-run.json test-results/.last-run.json 2>/dev/null || true
          bunx playwright test --shard=${{ matrix.shard }}/4 --last-failed --retries=2
        env:
          CI: "1"

      # Upload artifacts produced exclusively by the rerun — these are the
      # ones that matter when triaging "did the flake clear or is it real?".
      # Distinct name so they don't collide with the first-run upload above.
      - name: Upload rerun artifacts (shard ${{ matrix.shard }})
        if: ${{ !cancelled() && steps.full_rerun.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rerun-shard-${{ matrix.shard }}
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.zip
            test-results/**/error-context.md
            playwright-report/**
          retention-days: 14
          if-no-files-found: ignore


