name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Cheap static guard that runs before any browser job: every e2e spec
  # that observes the journey-live-region MUST contain the explicit
  # no-consecutive-duplicates assertion (`not.toBe(<arr>[i - 1])`). The
  # journey-progression contract is the source of truth — any aria-live
  # spec that omits this guard could silently regress, so we fail the CI
  # at the lint step rather than waiting for a flaky reproduction.
  aria-live-guard:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no aria-live spec is missing the dupes guard
        run: |
          set -euo pipefail
          # Detect ONLY specs that actively record live-region mutations
          # (i.e., push into __live / __liveMutations arrays). Specs that
          # merely wait for the live-region element to attach do not need
          # the dupes guard because they never observe the message stream.
          mapfile -t live_specs < <(grep -lE '__live(Mutations)?[^A-Za-z0-9_]*\.push|\.push\([^)]*\.textContent' e2e/*.spec.ts || true)
          if [ "${#live_specs[@]}" -eq 0 ]; then
            echo "No aria-live observer specs found — refusing to silently pass."
            exit 1
          fi
          echo "Checking ${#live_specs[@]} aria-live observer spec(s) for the dupes guard:"
          printf '  - %s\n' "${live_specs[@]}"
          missing=()
          for f in "${live_specs[@]}"; do
            # Accept either `not.toBe(live[i - 1])` or any `<name>[i - 1]`
            # form (afterSlow, afterFast, mutations, etc).
            if ! grep -Eq 'not\.toBe\(\s*[A-Za-z_][A-Za-z0-9_]*\[\s*i\s*-\s*1\s*\]\s*\)' "$f"; then
              missing+=("$f")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo
            echo "::error::Specs observing the aria-live region are missing the consecutive-duplicates assertion:"
            printf '::error::  - %s\n' "${missing[@]}"
            echo
            echo "Add a guard equivalent to:"
            echo "    for (let i = 1; i < live.length; i++) {"
            echo "      expect(live[i]).not.toBe(live[i - 1]);"
            echo "    }"
            exit 1
          fi
          echo "OK — all aria-live specs include the dupes guard."

  smoke:
    needs: aria-live-guard
    timeout-minutes: 10
    runs-on: ubuntu-latest
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache bun's global install store, keyed on the lockfile.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      # Cache Playwright's browser download. The cache key includes the
      # @playwright/test version so a Playwright bump invalidates it.
      - name: Resolve Playwright + Node versions
        id: pw
        run: |
          echo "version=$(bun pm ls --json | jq -r '.dependencies["@playwright/test"].version // .devDependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"
          echo "node=$(node --version | tr -d 'v')" >> "$GITHUB_OUTPUT"

      # Cache key includes OS, arch, Node version, Playwright version, AND
      # bun.lock hash. This narrows the key enough to avoid collisions
      # across unrelated branches (different deps → different cache) while
      # still allowing a fallback hit when only the lockfile changed.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-node${{ steps.pw.outputs.node }}-playwright-${{ steps.pw.outputs.version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node${{ steps.pw.outputs.node }}-playwright-${{ steps.pw.outputs.version }}-
            ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.pw.outputs.version }}-


      - name: Install Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run e2e smoke (shortcuts + aria-live)
        run: bun run e2e:smoke
        env:
          CI: "1"

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-artifacts
          path: |
            test-results/**
            playwright-report/**
          retention-days: 14
          if-no-files-found: ignore

  # Targeted regression guard: the 4 specs we have historically had to
  # stabilize (shift-tab, keyboard-only, journey-progression, shortcuts
  # feedback). Runs after smoke and BEFORE the full sharded suite so a
  # regression in any of them fails fast — without paying for 4 shards.
  targeted:
    needs: smoke
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Resolve Playwright + Node versions
        id: pw
        run: |
          echo "version=$(bun pm ls --json | jq -r '.dependencies["@playwright/test"].version // .devDependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"
          echo "node=$(node --version | tr -d 'v')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-node${{ steps.pw.outputs.node }}-playwright-${{ steps.pw.outputs.version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node${{ steps.pw.outputs.node }}-playwright-${{ steps.pw.outputs.version }}-
            ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.pw.outputs.version }}-

      - name: Install Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run targeted regression specs (4 historically flaky)
        run: >-
          bunx playwright test
          --retries=2
          e2e/shift-tab-journey.spec.ts
          e2e/keyboard-only-journey.spec.ts
          e2e/journey-progression.spec.ts
          e2e/shortcuts-feedback.spec.ts
        env:
          CI: "1"

      # Same nomenclature/contract as the full shards: upload screenshots,
      # videos, traces, and error contexts on failure OR timeout. The job is
      # single-shard so the artifact name uses `shard-targeted` to keep the
      # `playwright-artifacts-shard-*` family consistent across all jobs.
      - name: Upload Playwright artifacts (shard targeted)
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-shard-targeted
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.zip
            test-results/**/error-context.md
            playwright-report/**
          retention-days: 14
          if-no-files-found: ignore

  # Full e2e suite sharded across 4 parallel runners. Each shard runs a
  # disjoint slice of the suite via Playwright's --shard=i/N flag, then
  # uploads its own artifacts on failure.
  full:
    needs: [smoke, targeted]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Resolve Playwright + Node versions
        id: pw
        run: |
          echo "version=$(bun pm ls --json | jq -r '.dependencies["@playwright/test"].version // .devDependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"
          echo "node=$(node --version | tr -d 'v')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-node${{ steps.pw.outputs.node }}-playwright-${{ steps.pw.outputs.version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node${{ steps.pw.outputs.node }}-playwright-${{ steps.pw.outputs.version }}-
            ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.pw.outputs.version }}-

      - name: Install Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run full e2e shard ${{ matrix.shard }}/4
        id: full_run
        run: bunx playwright test --shard=${{ matrix.shard }}/4
        env:
          CI: "1"

      # Upload per-shard artifacts on any non-success outcome (failure OR
      # cancellation/timeout) so recurring failures in the full suite always
      # land with screenshots, videos, and traces attached to the run.
      # `screenshot`/`trace`/`video` are configured as `retain-on-failure` in
      # playwright.config.ts, so test-results/** contains the .png / .webm /
      # .zip files Playwright produced for failing tests on this shard.
      - name: Upload Playwright artifacts (shard ${{ matrix.shard }})
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.zip
            test-results/**/error-context.md
            playwright-report/**
          retention-days: 14
          if-no-files-found: ignore

      # Snapshot the first-run artifacts so the rerun step below can start
      # from a clean test-results/ and we can still ship both runs as
      # separate artifacts (no overwrite, no merge ambiguity).
      - name: Stash first-run artifacts before rerun
        if: ${{ !cancelled() && failure() }}
        run: |
          mkdir -p .rerun-input
          if [ -f test-results/.last-run.json ]; then
            cp test-results/.last-run.json .rerun-input/.last-run.json
          fi
          if [ -d test-results ]; then
            mv test-results test-results-first-run
          fi

      # Automatic rerun of ONLY the specs that failed on this shard, using
      # Playwright's `--last-failed` flag (reads test-results/.last-run.json).
      # Bumping --retries=2 gives intermittent flakes one more chance before
      # the shard is declared red. Runs only when the first attempt failed
      # and the workflow wasn't cancelled.
      # Build a human-readable report of the specs Playwright will rerun
      # (i.e. the contents of .last-run.json with status == "failed"). This
      # gets uploaded alongside the rerun artifacts so triage doesn't need
      # to crack open .last-run.json or correlate trace.zip filenames.
      - name: Generate --last-failed report (shard ${{ matrix.shard }})
        id: last_failed_report
        if: ${{ !cancelled() && failure() && steps.full_run.outcome == 'failure' }}
        run: |
          mkdir -p rerun-report
          REPORT="rerun-report/last-failed-shard-${{ matrix.shard }}.txt"
          {
            echo "Shard:       ${{ matrix.shard }}/4"
            echo "Commit:      ${GITHUB_SHA}"
            echo "Workflow:    ${GITHUB_WORKFLOW} / run ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
            echo "Generated:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Specs queued for --last-failed rerun:"
            echo "-------------------------------------"
          } > "$REPORT"
          if [ -f .rerun-input/.last-run.json ]; then
            # Playwright stores { status: 'failed' | 'passed' | 'interrupted',
            # failedTests: ["<testId>", ...] }. The test IDs include the spec
            # file path; we extract unique spec files for the human summary
            # and also keep the raw JSON for tooling.
            jq -r '.failedTests[]? // empty' .rerun-input/.last-run.json \
              | sed 's/ .*//' \
              | sort -u \
              | tee -a "$REPORT" > /dev/null || true
            echo >> "$REPORT"
            echo "Raw .last-run.json:" >> "$REPORT"
            echo "-------------------" >> "$REPORT"
            jq '.' .rerun-input/.last-run.json >> "$REPORT" 2>/dev/null \
              || cat .rerun-input/.last-run.json >> "$REPORT"
          else
            echo "(no .last-run.json was produced by the first run)" >> "$REPORT"
          fi
          echo "::group::last-failed report (shard ${{ matrix.shard }})"
          cat "$REPORT"
          echo "::endgroup::"

      - name: Rerun only failed specs (shard ${{ matrix.shard }})
        id: full_rerun
        if: ${{ !cancelled() && failure() && steps.full_run.outcome == 'failure' }}
        run: |
          mkdir -p test-results
          cp .rerun-input/.last-run.json test-results/.last-run.json 2>/dev/null || true
          bunx playwright test --shard=${{ matrix.shard }}/4 --last-failed --retries=2
        env:
          CI: "1"

      # Upload artifacts produced exclusively by the rerun — these are the
      # ones that matter when triaging "did the flake clear or is it real?".
      # Distinct name so they don't collide with the first-run upload above.
      # The rerun-report/ directory carries the human-readable list of
      # specs that --last-failed selected for this shard.
      - name: Upload rerun artifacts (shard ${{ matrix.shard }})
        if: ${{ !cancelled() && steps.full_rerun.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rerun-shard-${{ matrix.shard }}
          path: |
            rerun-report/**
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.zip
            test-results/**/error-context.md
            playwright-report/**
          retention-days: 14
          if-no-files-found: ignore

  # Consolidated rerun report: downloads the per-shard --last-failed
  # reports produced by every `full` shard, concatenates them into one
  # file, uploads it as a single artifact, writes a job summary, and
  # posts a PR comment when any shard failed. Runs ALWAYS after `full`
  # (even on success or skipped reruns) so there's a single, predictable
  # place to look for results regardless of outcome.
  rerun-report-consolidated:
    needs: full
    if: ${{ always() && needs.full.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download all per-shard rerun artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-rerun-shard-*
          path: shard-artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Consolidate last-failed reports
        id: consolidate
        run: |
          set -euo pipefail
          mkdir -p consolidated
          OUT="consolidated/last-failed-all-shards.txt"
          FULL_RESULT="${{ needs.full.result }}"
          {
            echo "Consolidated --last-failed report"
            echo "================================="
            echo "Workflow:    ${GITHUB_WORKFLOW} / run ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
            echo "Commit:      ${GITHUB_SHA}"
            echo "Full result: ${FULL_RESULT}"
            echo "Generated:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
          } > "$OUT"

          shopt -s nullglob
          reports=(shard-artifacts/*/rerun-report/last-failed-shard-*.txt)
          shards_with_reports="${#reports[@]}"
          if [ "$shards_with_reports" -eq 0 ]; then
            if [ "$FULL_RESULT" = "success" ]; then
              echo "All shards passed on their first run — no reruns were needed." >> "$OUT"
            else
              echo "(no per-shard last-failed reports were produced — reruns may have been skipped)" >> "$OUT"
            fi
            echo "shards_with_reports=0" >> "$GITHUB_OUTPUT"
            echo "top_specs=" >> "$GITHUB_OUTPUT"
          else
            echo "Shards with rerun reports: $shards_with_reports" >> "$OUT"
            echo >> "$OUT"
            for f in $(printf '%s\n' "${reports[@]}" | sort); do
              echo "===== $f =====" >> "$OUT"
              cat "$f" >> "$OUT"
              echo >> "$OUT"
            done
            echo >> "$OUT"
            echo "Unique spec files across all shards:" >> "$OUT"
            echo "------------------------------------" >> "$OUT"
            UNIQUE_FILE="consolidated/unique-specs.txt"
            grep -hE '^e2e/.*\.spec\.(ts|tsx|js|jsx)' "${reports[@]}" 2>/dev/null \
              | sort -u > "$UNIQUE_FILE" || true
            if [ -s "$UNIQUE_FILE" ]; then
              cat "$UNIQUE_FILE" >> "$OUT"
            else
              echo "(none parseable)" >> "$OUT"
            fi
            echo "shards_with_reports=$shards_with_reports" >> "$GITHUB_OUTPUT"
            # Top 10 unique spec files for the summary / PR comment.
            {
              echo "top_specs<<EOF"
              head -n 10 "$UNIQUE_FILE" 2>/dev/null || true
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

          echo "::group::Consolidated report"
          cat "$OUT"
          echo "::endgroup::"

      # ALWAYS upload, even when no reruns ran. The file always exists
      # (we wrote at least the header above), so triage has a single,
      # predictable artifact to fetch regardless of outcome.
      - name: Upload consolidated rerun report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rerun-consolidated
          path: consolidated/**
          retention-days: 30
          if-no-files-found: warn

      # Job summary in the Actions UI: top failing specs + a direct link
      # to the consolidated artifact via the run's Artifacts panel.
      - name: Write GitHub Actions job summary
        if: ${{ !cancelled() }}
        env:
          FULL_RESULT: ${{ needs.full.result }}
          SHARDS_WITH_REPORTS: ${{ steps.consolidate.outputs.shards_with_reports }}
          TOP_SPECS: ${{ steps.consolidate.outputs.top_specs }}
        run: |
          ARTIFACT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}#artifacts"
          {
            echo "## Playwright full-suite rerun report"
            echo
            echo "- **Full job result:** \`${FULL_RESULT}\`"
            echo "- **Shards that produced a rerun report:** \`${SHARDS_WITH_REPORTS:-0}\`"
            echo "- **Consolidated artifact:** [\`playwright-rerun-consolidated\`](${ARTIFACT_URL})"
            echo
            if [ "${SHARDS_WITH_REPORTS:-0}" -gt 0 ]; then
              echo "### Top failing specs (up to 10)"
              echo
              if [ -n "${TOP_SPECS}" ]; then
                echo '```'
                echo "${TOP_SPECS}"
                echo '```'
              else
                echo "_No spec paths were parseable from the per-shard reports._"
              fi
            else
              if [ "${FULL_RESULT}" = "success" ]; then
                echo "_All shards passed on the first run — no reruns were needed._"
              else
                echo "_No per-shard rerun reports were produced (reruns may have been skipped)._"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Post the consolidated report as a PR comment when any shard
      # failed. Uses the github-script action to upsert a single comment
      # keyed by a hidden marker so reruns of the same PR replace the
      # previous report instead of stacking.
      - name: Post consolidated report as PR comment (on failure)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.full.result == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'consolidated/last-failed-all-shards.txt';
            if (!fs.existsSync(path)) {
              core.warning(`No consolidated report found at ${path}, skipping PR comment.`);
              return;
            }
            const MARKER = '<!-- playwright-rerun-consolidated -->';
            const ARTIFACT_URL = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}#artifacts`;
            const raw = fs.readFileSync(path, 'utf8');
            // GitHub comment body limit is 65536 chars. Cap the embedded
            // report well below that and link out for the rest.
            const MAX = 50000;
            const truncated = raw.length > MAX;
            const body = [
              MARKER,
              '### 🎭 Playwright full-suite failed — consolidated `--last-failed` report',
              '',
              `Run: [#${process.env.GITHUB_RUN_ID} (attempt ${process.env.GITHUB_RUN_ATTEMPT})](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`,
              `Artifact: [\`playwright-rerun-consolidated\`](${ARTIFACT_URL})`,
              '',
              '<details><summary>Consolidated report' + (truncated ? ' (truncated — see artifact for full)' : '') + '</summary>',
              '',
              '```',
              truncated ? raw.slice(0, MAX) + '\n... [truncated]' : raw,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const prior = existing.find(c => c.body && c.body.includes(MARKER));
            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
              core.info(`Updated PR comment ${prior.id}`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info(`Created new PR comment`);
            }


