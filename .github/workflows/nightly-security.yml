name: Nightly Security Scan

# Runs the CI regression gate every night at 06:00 UTC (03:00 BRT) plus
# on-demand. Compared to the CI job it also:
#   1. Downloads the latest previous nightly artifact and runs
#      scripts/compare-security-artifacts.ts against it to surface which
#      targeted internal_ids reappeared and which tests regressed vs
#      the previous run.
#   2. Runs scripts/check-definer-coherence.ts as an independent
#      schema-level probe.
#   3. Notifies Slack via SLACK_SECURITY_WEBHOOK_URL when any regression
#      is detected — either targeted internal_id reappearance or a
#      failing regression test. The webhook is optional; when the secret
#      is unset the workflow still opens a GitHub Issue as before.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Download previous nightly report (best-effort)
        id: prev
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: nightly-security.yml
          workflow_conclusion: ""
          name_is_regexp: true
          name: nightly-security-report-.*
          path: previous-security-report/
          if_no_artifact_found: warn

      - name: Run security regression suite
        id: scan
        run: |
          mkdir -p security-report
          set +e
          bunx vitest run \
            src/lib/security-regression.integration.test.ts \
            src/lib/cron-auth.server.test.ts \
            src/routes/api/public/hooks/cron-secret-regression.test.ts \
            --reporter=verbose \
            --reporter=json --outputFile=security-report/regression-results.json \
            2>&1 | tee security-report/regression.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          CRON_SECRET: nightly-regression-placeholder
          VITE_SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3
          SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3

      - name: SECURITY DEFINER / GRANT coherence probe
        id: coherence
        run: |
          set +e
          bun run security:coherence 2>&1 | tee -a security-report/coherence.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          VITE_SUPABASE_URL: https://lkvfvriexuxlvrufbqbf.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_wq43mYCRgxQ11IfBOkHi7w_Ihw2O_A3

      - name: Compare against previous nightly artifact
        id: compare
        run: |
          set +e
          PREV=$(find previous-security-report -name regression-results.json -print -quit 2>/dev/null || true)
          echo "previous_path=${PREV:-none}" >> "$GITHUB_OUTPUT"
          bun run scripts/compare-security-artifacts.ts \
            ${PREV:+--previous "$PREV"} \
            --current security-report/regression-results.json \
            --out security-report/delta.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload security report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-security-report-${{ github.run_number }}
          path: security-report/
          retention-days: 90

      - name: Summarize into job summary
        if: always()
        run: |
          {
            echo "# Nightly Security Scan"
            echo ""
            echo "- Regression suite exit: \`${{ steps.scan.outputs.exit_code }}\`"
            echo "- Coherence probe exit:  \`${{ steps.coherence.outputs.exit_code }}\`"
            echo "- Compare vs previous exit: \`${{ steps.compare.outputs.exit_code }}\`"
            echo "- Previous artifact:     \`${{ steps.compare.outputs.previous_path }}\`"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            if [ -f security-report/delta.md ]; then
              cat security-report/delta.md
            fi
            echo ""
            echo "## Regression log tail"
            echo '```'
            tail -n 60 security-report/regression.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack on failure
        if: >
          env.SLACK_SECURITY_WEBHOOK_URL != '' &&
          (steps.scan.outputs.exit_code != '0'
           || steps.coherence.outputs.exit_code != '0'
           || steps.compare.outputs.exit_code != '0')
        env:
          SLACK_SECURITY_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DELTA=""
          if [ -f security-report/delta.md ]; then
            DELTA=$(head -c 2500 security-report/delta.md)
          fi
          jq -n \
            --arg text "🔒 *Nightly security regression detected*
Regression suite: exit ${{ steps.scan.outputs.exit_code }}
Coherence probe:  exit ${{ steps.coherence.outputs.exit_code }}
Delta vs previous: exit ${{ steps.compare.outputs.exit_code }}

<${RUN_URL}|Open workflow run>

\`\`\`
$DELTA
\`\`\`" \
            '{text: $text}' \
            | curl -sS -X POST -H "Content-Type: application/json" \
                --data @- "$SLACK_SECURITY_WEBHOOK_URL" || true

      - name: Open / update alert issue on failure
        if: >
          steps.scan.outputs.exit_code != '0'
          || steps.coherence.outputs.exit_code != '0'
          || steps.compare.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "🔒 Nightly security regression detected";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let delta = "";
            try { delta = fs.readFileSync("security-report/delta.md", "utf8").slice(0, 4000); } catch {}
            const body = [
              "The nightly security regression suite failed.",
              "",
              "**Targeted findings under watch:**",
              "- `SUPA_anon_security_definer_function_executable`",
              "- `SUPA_authenticated_security_definer_function_executable`",
              "- `SUPA_function_search_path_mutable`",
              "- `jobs_recruitment_contact_anon_exposure`",
              "- `my_profile_anon_sensitive_columns`",
              "- CRON_SECRET enforcement on `/api/public/hooks/*`",
              "",
              `Run: ${runUrl}`,
              "",
              "Download the `nightly-security-report-*` artifact for full logs + JSON.",
              "",
              "---",
              "",
              delta || "_no delta.md available_",
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "security,regression",
              per_page: 20,
            });
            const match = existing.data.find((i) => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["security", "regression"],
              });
            }

      - name: Fail the workflow if anything regressed
        if: >
          steps.scan.outputs.exit_code != '0'
          || steps.coherence.outputs.exit_code != '0'
          || steps.compare.outputs.exit_code != '0'
        run: exit 1
